# 自动打包并发布 Release
#
# 发新版：新建发布说明 docs/releases/<版本>.md（例如 docs/releases/v0.1.2.md），推送到 main。
# 工作流会为还没有 Release 的说明文件打标签、打包并发布。
# 也可以在 GitHub 网页的 Actions → Release → Run workflow 手动运行（同样只发布还没有的版本）。

name: Release

on:
  push:
    branches: [main]
    paths: ['docs/releases/v*.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find versions without a release
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          todo=""
          for f in docs/releases/v*.md; do
            tag=$(basename "$f" .md)
            gh release view "$tag" >/dev/null 2>&1 || todo="$todo $tag"
          done
          echo "要发布：${todo:-（无）}"
          echo "tags=$todo" >> "$GITHUB_OUTPUT"

      - name: Check scripts
        if: steps.todo.outputs.tags != ''
        run: |
          sudo apt-get install -y -qq shellcheck
          for f in install.sh get.sh files/litebox files/litebox.init scripts/build-release.sh scripts/test-openwrt.sh; do
            sh -n "$f"
          done
          shellcheck -s sh -S error install.sh get.sh files/litebox files/litebox-firewall.sh scripts/build-release.sh scripts/check-web.sh scripts/check-docs.sh
          sh scripts/check-web.sh
          sh scripts/check-docs.sh

      - name: Install test on OpenWrt 21.02
        if: steps.todo.outputs.tags != ''
        run: sh scripts/test-openwrt.sh

      - name: Build packages
        if: steps.todo.outputs.tags != ''
        run: sh scripts/build-release.sh

      - name: Publish release
        if: steps.todo.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.todo.outputs.tags }}
        run: |
          for tag in $TAGS; do
            # 发布说明后面附上校验值：get.sh 单独列出，方便照着 README 先校验再运行
            {
              cat "docs/releases/$tag.md"
              echo
              echo "## 校验值（SHA256）"
              echo
              echo "一键安装脚本 get.sh：\`$(awk '$2 == "get.sh" { print $1 }' dist/SHA256SUMS)\`"
              echo
              echo "推荐的安装方式（先下载、校验、再执行）见 [README](https://github.com/${GITHUB_REPOSITORY}#第-2-步粘贴一条命令一路回车)。全部文件："
              echo
              echo '```'
              cat dist/SHA256SUMS
              echo '```'
            } > notes.md
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "LiteBox $tag" \
              --notes-file notes.md --latest
          done
