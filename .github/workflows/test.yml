# 改了安装脚本或管理命令就在 OpenWrt 21.02 容器里完整装一遍（发布前 release.yml 也会再跑一次）

name: Test

on:
  push:
    branches: [main]
    paths: ['install.sh', 'get.sh', 'files/**', 'scripts/**']
  pull_request:
  workflow_dispatch:

jobs:
  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          for f in install.sh get.sh files/litebox files/litebox.init scripts/build-release.sh scripts/test-openwrt.sh; do
            sh -n "$f"
          done
          shellcheck -s sh -S error install.sh get.sh files/litebox scripts/build-release.sh

      - name: Install test on OpenWrt 21.02
        run: sh scripts/test-openwrt.sh
